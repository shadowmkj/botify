services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=botify
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  app:
    image: ghcr.io/iamshadow666/botify-app:latest
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'
      - '3001:3001'
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
