services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret 
      POSTGRES_DB: botify 
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
  app:
    image: ghcr.io/iamshadow666/botify:main
    restart: always
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    env_file:
      - production.env
    environment:
      - MEDIA_STORAGE_DIR=/app/media
    volumes:
      - media_data:/app/apps/web/public/media
volumes:
  postgres_data:
  redis_data:
  media_data:
