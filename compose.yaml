services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: botify
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    image: ghcr.io/iamshadow666/botify:main
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - production.env
    command: sh -lc "pnpm --filter @repo/db exec prisma migrate deploy"

  app:
    image: ghcr.io/iamshadow666/botify:main
    restart: always
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - production.env
    environment:
      - MEDIA_STORAGE_DIR=/app/media
    volumes:
      - media_data:/app/apps/web/public/media

volumes:
  postgres_data:
  redis_data:
  media_data:
