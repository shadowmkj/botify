services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  web:
    image: ghcr.io/iamshadow666/botify-web:latest
    restart: always
    depends_on:
      - wserver
    ports:
      - '3000:3000'
    env_file:
      - .env

  wserver:
    image: ghcr.io/iamshadow666/botify-wserver:latest
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - '3001:3001'
    env_file:
      - .env

  socket:
    image: ghcr.io/iamshadow666/botify-socket:latest
    restart: always
    depends_on:
      - redis
    ports:
      - '3002:3002' # Assuming port 3002 for the socket server
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data: