apiVersion: v1
kind: Pod
metadata:
  name: infra-pod
  labels:
    app: multi-db
spec:
  containers:
    # --- Postgres Container ---
    - name: postgres-db
      image: postgres:15
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_PASSWORD
          value: "mysecretpassword" # Use Secrets in production
        - name: POSTGRES_DB
          value: "mydb"

    # --- Redis Container ---
    - name: redis-db
      image: redis:alpine
      ports:
        - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  type: LoadBalancer
  selector:
    app: multi-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  type: LoadBalancer
  selector:
    app: multi-db
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
